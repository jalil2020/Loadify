# Loadify — full local stack.
#
#   cp .env.example .env
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d
#
# (or `make up`). Without --env-file compose reads deploy/.env, not the one
# in the repository root.
#
# Every service waits on its dependencies being *healthy*, not merely started,
# so the API never comes up against a Postgres that is still initialising.

name: loadify

# What the API and the posting worker both read. They share one database, one
# Redis and one set of keys, and a mismatch between them is a bug: the API seals
# a Telegram session with the key the worker opens it with, and both apply the
# same sending limits.
x-core-env: &core-env
  APP_ENV: ${APP_ENV:-development}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Tashkent}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${DB_USER:-loadify}
  DB_PASSWORD: ${DB_PASSWORD:-loadify_secret}
  DB_NAME: ${DB_NAME:-loadify}
  DB_SSLMODE: disable
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
  FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:-}

x-telegram-env: &telegram-env
  TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
  TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
  TELEGRAM_SESSION_KEK: ${TELEGRAM_SESSION_KEK:-}
  TELEGRAM_SESSION_KEK_VERSION: ${TELEGRAM_SESSION_KEK_VERSION:-1}
  TELEGRAM_SESSION_KEK_PREVIOUS: ${TELEGRAM_SESSION_KEK_PREVIOUS:-}
  TELEGRAM_SESSION_KEK_PREVIOUS_VERSION: ${TELEGRAM_SESSION_KEK_PREVIOUS_VERSION:-0}
  TELEGRAM_DEVICE_MODEL: ${TELEGRAM_DEVICE_MODEL:-Loadify}
  TELEGRAM_APP_VERSION: ${TELEGRAM_APP_VERSION:-1.0}
  TELEGRAM_ACCOUNT_GAP: ${TELEGRAM_ACCOUNT_GAP:-90s}
  TELEGRAM_ACCOUNT_HOURLY: ${TELEGRAM_ACCOUNT_HOURLY:-20}
  TELEGRAM_ACCOUNT_DAILY: ${TELEGRAM_ACCOUNT_DAILY:-120}
  TELEGRAM_GROUP_COOLDOWN: ${TELEGRAM_GROUP_COOLDOWN:-1h}
  TELEGRAM_GROUP_DAILY: ${TELEGRAM_GROUP_DAILY:-3}
  TELEGRAM_DUPLICATE_WINDOW: ${TELEGRAM_DUPLICATE_WINDOW:-24h}
  TELEGRAM_GLOBAL_PER_SECOND: ${TELEGRAM_GLOBAL_PER_SECOND:-10}
  TELEGRAM_MAX_ATTEMPTS: ${TELEGRAM_MAX_ATTEMPTS:-5}
  TELEGRAM_LEASE_TTL: ${TELEGRAM_LEASE_TTL:-2m}
  TELEGRAM_TRUST_RANDOM_ID: ${TELEGRAM_TRUST_RANDOM_ID:-false}

# Only the API reads adverts, so only the API calls a model.
x-ai-env: &ai-env
  AI_PROVIDER: ${AI_PROVIDER:-none}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_TIMEOUT: ${AI_TIMEOUT:-20s}
  AI_CACHE_TTL: ${AI_CACHE_TTL:-24h}
  AI_PRICE_INPUT_PER_MTOK: ${AI_PRICE_INPUT_PER_MTOK:-0}
  AI_PRICE_OUTPUT_PER_MTOK: ${AI_PRICE_OUTPUT_PER_MTOK:-0}
  AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD:-0}
  HERMES_BASE_URL: ${HERMES_BASE_URL:-}
  HERMES_API_KEY: ${HERMES_API_KEY:-}

services:
  postgres:
    # PostGIS, not plain Postgres: geography columns and ST_DWithin are load-
    # bearing for every search in the product.
    image: postgis/postgis:16-3.4-alpine
    container_name: loadify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-loadify}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-loadify_secret}
      POSTGRES_DB: ${DB_NAME:-loadify}
      # Data checksums catch silent corruption; worth the few percent.
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: Asia/Tashkent
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-loadify} -d ${DB_NAME:-loadify}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      # Log anything slower than a second: at our query shapes that is a bug.
      - -c
      - log_min_duration_statement=1000
    networks: [loadify]

  redis:
    image: redis:7-alpine
    container_name: loadify-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      # Sessions and rate-limit counters are the bulk of the keyspace and all
      # carry a TTL, so evicting the least recently used is the right policy.
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [loadify]

  minio:
    image: minio/minio:latest
    container_name: loadify-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-loadify}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-loadify_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [loadify]

  # A one-shot job: creates the bucket and exits. Without it the first upload
  # fails against a bucket that does not exist yet.
  minio-init:
    image: minio/mc:latest
    container_name: loadify-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-loadify} ${S3_SECRET_KEY:-loadify_secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-loadify} &&
      mc anonymous set download local/${S3_BUCKET:-loadify}/avatars &&
      mc anonymous set download local/${S3_BUCKET:-loadify}/logos &&
      echo 'bucket ready'
      "
    networks: [loadify]

  # Migrations run as their own job rather than on API start-up, so two API
  # replicas cannot race to migrate the same database.
  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    container_name: loadify-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-loadify}
      DB_PASSWORD: ${DB_PASSWORD:-loadify_secret}
      DB_NAME: ${DB_NAME:-loadify}
      DB_SSLMODE: disable
    entrypoint: ["/app/migrate", "up"]
    restart: "no"
    networks: [loadify]

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    container_name: loadify-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: [*core-env, *telegram-env, *ai-env]
      APP_PORT: 8080
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-loadify}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-loadify_secret}
      S3_BUCKET: ${S3_BUCKET:-loadify}
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      SMS_ESKIZ_EMAIL: ${SMS_ESKIZ_EMAIL:-}
      SMS_ESKIZ_PASSWORD: ${SMS_ESKIZ_PASSWORD:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      PLATFORM_COMMISSION_PERCENT: ${PLATFORM_COMMISSION_PERCENT:-5}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
      PAYME_SECRET_KEY: ${PAYME_SECRET_KEY:-}
      UZUM_MERCHANT_ID: ${UZUM_MERCHANT_ID:-}
      UZUM_SECRET_KEY: ${UZUM_SECRET_KEY:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ../secrets:/app/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [loadify]

  # Sends queued posts to Telegram. It is its own process on purpose: sessions
  # are opened only here, and deploying the API never interrupts a send.
  # `docker compose up --scale poster=2` is safe - jobs are claimed, never
  # shared, and the limits live in Redis, so more workers never means more
  # posts per account. That is also why it has no container_name.
  poster:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: [*core-env, *telegram-env]
      # A send already on its way has to finish and be written down, or a
      # restart could post it twice; stop_grace_period leaves room for this.
      APP_SHUTDOWN_GRACE: ${POSTER_SHUTDOWN_GRACE:-40s}
    entrypoint: ["/app/poster"]
    stop_grace_period: 50s
    volumes:
      - ../secrets:/app/secrets:ro
    healthcheck:
      # No port to probe: the worker refreshes this file while Postgres and
      # Redis both answer.
      test: ["CMD-SHELL", "find /tmp/loadify-poster.alive -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [loadify]

  nginx:
    image: nginx:1.27-alpine
    container_name: loadify-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx-cache:/var/cache/nginx
    networks: [loadify]
    profiles: [proxy]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  nginx-cache:

networks:
  loadify:
    driver: bridge
