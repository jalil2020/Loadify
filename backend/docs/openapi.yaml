openapi: 3.0.3

info:
  title: Loadify API
  version: "1.0.0"
  description: |
    Freight marketplace connecting logistics companies and truck drivers.

    ## Conventions

    - **Money** is always an integer in **minor units** (tiyin for UZS, cents for
      USD) with an explicit `currency` field. Never send a decimal amount.
    - **Timestamps** are RFC 3339 in UTC.
    - **Coordinates** are WGS 84 (`{"lat": 41.2995, "lng": 69.2401}`).
    - **Every response** uses the envelope below; list endpoints add `meta`.
    - **Pagination**: `?page=1&per_page=20` (max 100), `?sort=field&order=desc`
      or `?sort=-field`. Sort fields are allowlisted per endpoint; an unknown
      value falls back to the default order rather than erroring.
    - **Localisation**: send `Accept-Language: uz | ru | en`.

    ## Authentication

    Send `Authorization: Bearer <access_token>`. Access tokens last 15 minutes;
    refresh with `POST /auth/refresh`, which rotates the refresh token. Reusing
    an already-rotated refresh token revokes the whole token family and returns
    `TOKEN_REUSE_DETECTED` — treat that as "sign in again".

    The WebSocket endpoint accepts the token as `?token=` because browsers
    cannot set headers on a handshake.
  contact:
    name: Loadify Engineering
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080/api/v1
    description: Local
  - url: https://api.loadify.uz/api/v1
    description: Production

tags:
  - name: Auth
  - name: Reference
  - name: Files
  - name: Drivers
  - name: Companies
  - name: Loads
  - name: Bookings
  - name: Trips
  - name: Chat
  - name: Notifications
    description: |
      Besides marketplace events, the posting worker reports what stops
      distribution. Each is its own `type`, so each can be muted separately in
      preferences:

      - `telegram.account_restricted` - Telegram restricted an account
        (PEER_FLOOD). Posting from it stopped and its queue was cancelled. Sent
        to the owner, company managers and platform admins. High priority.
      - `telegram.account_revoked` - the session ended; connect again. Owner
        and managers. High priority.
      - `telegram.account_paused` - Telegram asked for a wait of 15 minutes or
        more. Owner; platform admins too from one hour.
      - `telegram.group_closed` - the account may no longer write in a group,
        and posting there is off. Owner and managers.
      - `telegram.group_lost` - the account is no longer in a group. Owner and
        managers.
      - `telegram.unknown_error` - Telegram refused a post for a reason the
        platform does not classify. Platform admins only.

      Each problem is reported once a day per account, group or error code
      (a pause once per pause), in the recipient's language. `data` carries
      `kind`, `company_id`, `account_id` and, where they apply, `group_id`,
      `until`, `cancelled` and `error_code`.
  - name: Payments
  - name: Admin
  - name: Load adverts
    description: Freight adverts written in plain language, read into fields.
  - name: Telegram
    description: |
      Each person connects their own Telegram account and chooses groups it is
      already a member of. The platform never joins groups and never posts from
      an account its owner did not connect.
  - name: Distribution
    description: |
      Review, publish and follow adverts through the anti-spam guard and the
      queue, with the plan's allowances and the dashboard.

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register and receive an SMS code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password, role]
              properties:
                phone: { type: string, example: "+998901234567" }
                password: { type: string, format: password, minLength: 8 }
                first_name: { type: string }
                last_name: { type: string }
                role:
                  type: string
                  enum: [driver, company]
                locale: { type: string, enum: [uz, ru, en] }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "409":
          description: The phone number is already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Confirm the SMS code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, purpose]
              properties:
                phone: { type: string }
                code: { type: string, example: "123456" }
                purpose:
                  type: string
                  enum: [register, login, reset_password, change_phone]
      responses:
        "200":
          description: Verified; tokens are returned for register and login
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthResponse" }
        "422":
          description: The code is wrong or expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in with phone and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "423":
          description: Locked after too many failed attempts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: A new pair; the presented refresh token is now invalid
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          description: |
            Invalid, expired, or reused. `TOKEN_REUSE_DETECTED` means the whole
            family was revoked as a theft response — sign in again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /auth/me:
    get:
      tags: [Auth]
      summary: The signed-in principal
      responses:
        "200":
          description: The current user, with effective permissions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /search/parse:
    post:
      tags: [Search]
      summary: Turn a written request into filters
      description: |
        Resolves a freight request written the way someone would say it —
        "Toshkentdan Samarqandga ertaga 20 tonna tent" — into the query
        parameters `/loads` and `/drivers` already accept.

        It returns filters rather than results, deliberately. The client shows
        them as removable chips before fetching anything, so a mis-parse is
        visible and correctable rather than silently changing what was searched,
        and search keeps exactly one implementation.

        Rules-based, not a model: the vocabulary is closed, so Uzbek case
        endings (`-dan` for origin, `-ga` for destination), Russian and English
        prepositions, both scripts and every apostrophe variant all resolve
        deterministically and offline. Names are resolved against the reference
        vocabularies — an identifier is never invented, and anything
        unresolvable comes back in `dropped` instead of quietly widening the
        search.

        The same utterance projects differently onto each side of the market: a
        stated tonnage caps the freight worth showing a driver
        (`max_weight_kg`) and floors the capacity worth showing a shipper
        (`min_capacity_kg`).

        Unauthenticated, like the board it feeds.
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 2
                  maxLength: 280
                  example: Toshkentdan Samarqandga ertaga 20 tonna tent
                target:
                  type: string
                  enum: [loads, drivers]
                  default: loads
                  description: Which side of the market to project onto.
      responses:
        "200":
          description: The parse
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ParsedSearch" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /loads:
    get:
      tags: [Loads]
      summary: Search the marketplace
      description: |
        Open to guests, who see the board without contact details. A driver's
        phone reveals the shipper's number only after a live booking exists.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - { in: query, name: pickup_region_id, schema: { type: array, items: { type: string, format: uuid } } }
        - { in: query, name: delivery_region_id, schema: { type: array, items: { type: string, format: uuid } } }
        - { in: query, name: pickup_lat, schema: { type: number, format: double } }
        - { in: query, name: pickup_lng, schema: { type: number, format: double } }
        - { in: query, name: pickup_radius_km, schema: { type: number, default: 100, maximum: 1000 } }
        - { in: query, name: vehicle_type, schema: { type: array, items: { $ref: "#/components/schemas/VehicleType" } } }
        - { in: query, name: min_weight_kg, schema: { type: integer } }
        - { in: query, name: max_weight_kg, schema: { type: integer } }
        - { in: query, name: min_price, schema: { type: integer, description: minor units } }
        - { in: query, name: max_price, schema: { type: integer, description: minor units } }
        - { in: query, name: requires_adr, schema: { type: boolean } }
        - { in: query, name: requires_refrigeration, schema: { type: boolean } }
        - in: query
          name: fits_my_vehicle
          schema: { type: boolean }
          description: >
            Restrict to loads the driver's primary approved truck can legally
            carry — capacity, volume, body type, ADR, temperature and dimensions.
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - { $ref: "#/components/parameters/Sort" }
      responses:
        "200":
          description: A page of loads
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Load" }
    post:
      tags: [Loads]
      summary: Create a shipment
      description: >
        Requires `loads.create`. Set `publish: true` to go straight to the
        board; the company must be verified and within its plan's active-load
        limit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveLoadRequest" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "402":
          description: The plan's active-load limit is reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /loads/{id}:
    get:
      tags: [Loads]
      summary: One load
      security:
        - bearerAuth: []
        - {}
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      responses:
        "200":
          description: The load
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Load" }
        "404": { $ref: "#/components/responses/NotFound" }

  /loads/{id}/reserve:
    post:
      tags: [Bookings]
      summary: Reserve a load as a driver
      description: |
        Creates a booking in `pending` and notifies the shipper. Rejected when
        the driver is unverified, the chosen truck does not meet the load's
        requirements, a live booking already exists for this pair, or the driver
        has an overlapping trip.
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicle_id: { type: string, format: uuid }
                offered_price: { type: integer, description: minor units }
                message: { type: string, maxLength: 1000 }
      responses:
        "201":
          description: The booking
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Booking" }
        "403":
          description: DRIVER_NOT_VERIFIED or NO_APPROVED_VEHICLE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: BOOKING_EXISTS, LOAD_NOT_PUBLISHED or TRIP_CONFLICT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: VEHICLE_UNSUITABLE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /bookings/{id}/respond:
    post:
      tags: [Bookings]
      summary: Accept or reject a booking
      description: >
        Only the side that did **not** initiate may respond. Accepting creates
        the trip and closes every other open booking on the load in the same
        transaction.
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accept]
              properties:
                accept: { type: boolean }
                agreed_price: { type: integer, description: minor units }
                message: { type: string }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Already answered, or the load was assigned elsewhere
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /trips/{id}/advance:
    post:
      tags: [Trips]
      summary: Move a trip forward
      description: |
        Driver-only. Valid transitions:
        `created → en_route_to_pickup → at_pickup → loaded → in_transit →
        at_delivery → delivered`.

        A driver cannot set `completed` (that is the shipper confirming) or
        `cancelled` (that has commercial consequences). Once the cargo is
        `loaded` the trip can no longer be cancelled — it must be delivered or
        disputed.
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [en_route_to_pickup, at_pickup, loaded, in_transit, at_delivery, delivered]
                location: { $ref: "#/components/schemas/Point" }
                note: { type: string }
                document_file_ids:
                  type: array
                  items: { type: string, format: uuid }
                odometer_km: { type: number, format: double }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "403":
          description: Not your trip, or not a driver-settable status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: INVALID_STATUS_TRANSITION
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /trips/{id}/confirm:
    post:
      tags: [Trips]
      summary: Confirm delivery and close the trip
      description: >
        Company-side. Takes the platform commission and releases the escrow to
        the driver. A delivered trip the shipper never confirms is auto-closed
        after 72 hours so the driver is not left unpaid.
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "409": { $ref: "#/components/responses/Conflict" }

  /trips/{id}/track:
    get:
      tags: [Trips]
      summary: Live position and travelled route
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      responses:
        "200":
          description: Tracking data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          trip_id: { type: string, format: uuid }
                          status: { type: string }
                          current_location: { $ref: "#/components/schemas/Point" }
                          updated_at: { type: string, format: date-time }
                          eta_at: { type: string, format: date-time }
                          distance_done_km: { type: number, format: double }
                          route:
                            type: array
                            items: { $ref: "#/components/schemas/Point" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /wallet:
    get:
      tags: [Payments]
      summary: Balance
      description: >
        A company member sees the company wallet; everyone else their own.
        `available` is `balance - held_balance`; held funds are committed to an
        escrow and cannot be spent.
      responses:
        "200":
          description: The wallet
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Wallet" }

  /escrow/fund:
    post:
      tags: [Payments]
      summary: Secure a trip's price
      description: >
        Holds the agreed amount in the shipper's wallet and moves it to the
        clearing account. Released to the driver net of commission on delivery
        confirmation, refunded in full if the trip is cancelled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trip_id]
              properties:
                trip_id: { type: string, format: uuid }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "402":
          description: INSUFFICIENT_FUNDS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /payments/webhooks/{provider}:
    post:
      tags: [Payments]
      summary: Provider callback
      description: |
        Unauthenticated by necessity — the provider holds no token — and
        protected entirely by the per-provider signature check.

        Always answers `200` with a provider-shaped body, because a non-200
        makes most providers retry indefinitely. A rejected signature is
        recorded and reported inside the body. Replays are no-ops.
      security: []
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [click, payme, uzum] }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object } }
          application/x-www-form-urlencoded: { schema: { type: object } }
      responses:
        "200":
          description: Provider-shaped acknowledgement
          content:
            application/json: { schema: { type: object } }

  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Live marketplace snapshot
      parameters:
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /load-ads/parse:
    post:
      tags: [Load adverts]
      summary: Read a freight advert written in plain language
      description: |
        Turns an advert as someone would post it — "Ташкент → Москва, 20 тонн,
        тент, загрузка завтра, 2500$" — into a draft. It stores nothing.

        Every field comes back with the rule that produced it and the words it
        was read from, so the client can show removable chips and a person can
        see a misread before a hundred groups do. What nobody could resolve is
        listed in "dropped" rather than swallowed, and what the advert still
        needs before it can be posted is listed in "missing".

        Nothing is guessed. A tonnage that was not stated stays null; a figure
        with no currency beside it is reported as unresolved rather than
        assumed, because on these corridors the same number could be dollars,
        so'm or roubles.

        Rules first: cities and regions across the region, Uzbek case endings
        that state the direction, Russian and English prepositions, both
        scripts. Relative days are resolved on the server against the company
        timezone.

        When a model is configured it is asked only about fields the rules left
        empty, and only when words were left unread. Each call is charged to the
        company's monthly "ai_requests" allowance; an advert read before is
        answered from cache for nothing. Once the allowance or the platform's
        daily budget is spent the rules still read the advert and ai_status
        says "limited" - parsing itself is never refused for it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 3
                  maxLength: 4000
                  example: "Ташкент → Москва\n20 тонн\nтент\nзагрузка завтра\n2500$"
      responses:
        "200":
          description: What was understood
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ParsedAdvert" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /load-ads:
    get:
      tags: [Load adverts]
      summary: List the company adverts
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [draft, ready, publishing, published, archived] } }
        - { in: query, name: mine, schema: { type: boolean }, description: Only adverts the caller created }
        - { in: query, name: search, schema: { type: string, maxLength: 120 } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: A page of adverts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/LoadAd" }
    post:
      tags: [Load adverts]
      summary: Store an advert a person confirmed
      description: |
        Almost every field is optional, because an advert that omits the volume
        or the cargo type is normal and requiring a value would only invite an
        invented one. What is required is what a group needs to act on the post:
        where from, where to, and someone to call. An advert missing any of them
        is stored as a draft rather than refused.

        Every stored advert counts against the plan's monthly "loads"
        allowance, archived or not, so archiving does not hand it back.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveLoadAd" }
      responses:
        "201":
          description: The stored advert
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/LoadAd" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /load-ads/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Load adverts]
      summary: Read one advert
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The advert
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/LoadAd" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Load adverts]
      summary: Edit an advert
      description: |
        An advert that has already been posted stays published: editing it
        changes what the next run sends, never what the groups already received.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveLoadAd" }
      responses:
        "200":
          description: The updated advert
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/LoadAd" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Load adverts]
      summary: Archive an advert
      description: |
        The row stays. Posts that went out still point at it, and a history
        entry whose advert vanished explains nothing.
      security:
        - bearerAuth: []
      responses:
        "204": { description: Archived }
        "404": { $ref: "#/components/responses/NotFound" }

  /load-ads/{id}/publish/preview:
    post:
      tags: [Distribution]
      summary: Work out where an advert would go
      description: |
        Runs the whole funnel and explains it: how many groups matched, which
        are approved, and for every one held back, why - a cooldown, a daily
        limit, a duplicate, quiet hours, a corridor that does not match.

        It sends nothing and consumes no allowance, so a person can look twice.
        posts_left says how much of the plan's monthly allowance remains.
        The reply carries a preview_token that ties a publish to the list that
        was actually reviewed; it is valid for ten minutes and single use.
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - in: query
          name: account_id
          schema: { type: string, format: uuid }
          description: Which connected account to post from. Only your own accounts are accepted.
      responses:
        "200":
          description: What would be sent, and what would not
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PublishPreview" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /load-ads/{id}/publish:
    post:
      tags: [Distribution]
      summary: Queue the advert for the reviewed groups
      description: |
        Queues one message per group. Nothing is sent by this request: the jobs
        are written down and the worker sends them within the limits, which is
        what makes the decision auditable and the sending restartable.

        An Idempotency-Key header is required. A retried request returns the run
        that already exists rather than posting the advert a second time.

        group_ids narrows the reviewed list and never extends it: a group that
        was not in the preview cannot be posted to by naming it here. If the
        advert changed after the review, the request is refused, because the
        list no longer describes what would be sent.

        Every group that will be attempted counts against the plan's monthly
        "posts" allowance; a group the guard already refused costs nothing, and
        a post that is later skipped, cancelled or fails is not counted. When
        the approved groups do not fit what is left, nothing is queued and 402
        is returned - narrow group_ids and publish again with the same preview.
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preview_token]
              properties:
                preview_token: { type: string }
                group_ids:
                  type: array
                  maxItems: 200
                  items: { type: string, format: uuid }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PublishResult" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /load-ads/{id}/posts:
    get:
      tags: [Distribution]
      summary: What happened to one advert, group by group
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: One line per group
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PostingJob" }

  /posting-history:
    get:
      tags: [Distribution]
      summary: Everything that went out, newest first
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [pending, processing, sent, failed, skipped, rate_limited, cancelled] } }
        - { in: query, name: group_id, schema: { type: string, format: uuid } }
        - { in: query, name: load_ad_id, schema: { type: string, format: uuid } }
        - { in: query, name: mine, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: A page of posts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PostingJob" }

  /posting-jobs/{id}/cancel:
    post:
      tags: [Distribution]
      summary: Stop a post that has not gone out yet
      description: |
        Only a queued or waiting post can be stopped. One already sent is
        refused rather than silently ignored, because the difference matters to
        whoever is asking.
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Cancelled }
        "409": { $ref: "#/components/responses/Conflict" }

  /telegram/accounts:
    get:
      tags: [Telegram]
      summary: List connected accounts
      description: |
        The caller's own accounts. A company manager may add company=true to see
        colleagues' accounts as well - their status, never anything that could be
        used to post as them. Phone numbers are masked.
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: company, schema: { type: boolean } }
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/TelegramAccount" }

  /telegram/accounts/login:
    post:
      tags: [Telegram]
      summary: Start connecting your own Telegram account
      description: |
        Telegram sends a code to the Telegram app on that phone. Connecting lets
        the platform post as this person, and Telegram's terms do not allow acting
        for someone without their knowledge, so consent_version must match the
        text the person was shown; the agreement is recorded with it.

        Rate limited tightly: every step reaches Telegram, and Telegram answers
        repeated attempts by locking the number.

        Refused with 402 before any code is sent when the plan's "tg_accounts"
        allowance is taken. An account holds a seat once connected, not while
        connecting.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, consent_version]
              properties:
                phone: { type: string, example: "+998901234567" }
                consent_version: { type: string, example: "2026-09" }
                label: { type: string, maxLength: 64 }
      responses:
        "201":
          description: Code sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TelegramLoginStep" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /telegram/accounts/{id}/code:
    post:
      tags: [Telegram]
      summary: Submit the code Telegram sent
      description: |
        Answers with step "password" when the account has two-step verification,
        or "connected" when signing in is complete. Five wrong codes end the
        attempt.

        If another sign-in took the plan's last account seat in the meantime,
        the session Telegram just issued is ended again and 402 is returned.
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 3, maxLength: 10 }
      responses:
        "200":
          description: The next step
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TelegramLoginStep" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /telegram/accounts/{id}/password:
    post:
      tags: [Telegram]
      summary: Submit the two-step verification password
      description: The password is used once for the exchange Telegram requires and is never stored or logged.
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password, maxLength: 256 }
      responses:
        "200":
          description: Connected
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TelegramLoginStep" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /telegram/accounts/{id}/dialogs:
    get:
      tags: [Telegram]
      summary: Groups this account could post to
      description: |
        Only groups and channels the account is already a member of. The platform
        never joins anything. can_send says whether this account may write there;
        group_id is set for the ones already connected.
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Dialogs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/TelegramDialog" }

  /telegram/accounts/{id}:
    delete:
      tags: [Telegram]
      summary: Disconnect an account
      description: |
        Ends the session on Telegram's side too, so it disappears from the
        person's list of devices, and cancels everything still queued from it.
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Disconnected }
        "404": { $ref: "#/components/responses/NotFound" }

  /telegram/groups:
    get:
      tags: [Telegram]
      summary: Connected groups with their rules
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/TelegramGroup" }
    post:
      tags: [Telegram]
      summary: Connect a group from the account's own list
      description: |
        The group must appear in the account's dialogs and the account must be
        allowed to write there. A new group gets cautious default rules - one
        post an hour, a few a day - and its own slow mode is recorded so the
        cooldown respects it.

        A new group takes one of the plan's "tg_groups" seats; connecting a
        group this account already has again does not.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, peer_id]
              properties:
                account_id: { type: string, format: uuid }
                peer_id:
                  type: string
                  description: As listed in dialogs. A string, because these ids exceed what a JavaScript number holds exactly.
                  example: "-1001234567890"
                language: { type: string, enum: [uz, ru, en] }
      responses:
        "201":
          description: Connected
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TelegramGroup" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /telegram/groups/{id}/rules:
    put:
      tags: [Telegram]
      summary: Say what a group accepts
      description: |
        Replaces the group's rules and corridors together, because they are one
        statement. A group may make posting rarer than the platform allows,
        never more frequent.
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupRules" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TelegramGroup" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /telegram/groups/{id}:
    delete:
      tags: [Telegram]
      summary: Stop posting to a group
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }

  /subscriptions/usage:
    get:
      tags: [Distribution]
      summary: What the company's plan allows and what is left
      description: |
        Monthly allowances (loads, posts, ai_requests) run by calendar month in
        the platform timezone and carry resets_at. Standing ones (tg_accounts,
        tg_groups) are how many may be connected at once and free up when one
        is removed. A null limit is no limit.

        Usage is counted from the records themselves: a post counts while it is
        waiting or once sent, and not once it was skipped, cancelled or failed;
        a model call counts unless it was answered from cache or refused.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The allowances
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Usage" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /dashboard:
    get:
      tags: [Distribution]
      summary: Today's distribution at a glance
      description: |
        Adverts, posts by outcome, why the anti-spam guard held posts back,
        connected accounts and groups, model use and cost, the plan's
        allowances, and the last few posts that did not go out.

        "Today" and "this month" are in the platform timezone, and posts are
        counted by when they were queued. A company manager sees the whole
        company by default; anyone else sees their own adverts, the posts sent
        from their own accounts and their own model calls. The allowances are
        always the company's, because the plan is.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: scope
          schema: { type: string, enum: [mine, company] }
          description: company is for managers only.
      responses:
        "200":
          description: The dashboard
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Dashboard" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PathID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      in: query
      name: per_page
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      in: query
      name: sort
      schema: { type: string }
      description: >
        Allowlisted per endpoint. Prefix with `-` for descending, or pass
        `order=asc|desc`. An unknown field falls back to the default order.

  responses:
    OK:
      description: Success
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Created:
      description: Created
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: Conflicts with the current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ValidationError:
      description: Validation failed; `details` names the fields
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    QuotaExceeded:
      description: |
        QUOTA_EXCEEDED - the company's plan does not allow this. The message
        says which allowance, what is left and when it starts again;
        GET /subscriptions/usage has the numbers.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    QuotaItem:
      type: object
      properties:
        metric:
          type: string
          enum: [loads, posts, ai_requests, tg_accounts, tg_groups]
        limit: { type: integer, nullable: true, description: Null is no limit. }
        used: { type: integer }
        remaining: { type: integer, nullable: true }
        resets_at:
          type: string
          format: date-time
          description: Only on monthly allowances.

    Usage:
      type: object
      properties:
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/QuotaItem" }

    PostCounts:
      type: object
      properties:
        total: { type: integer }
        queued:
          type: integer
          description: Waiting, being sent, or waiting again after Telegram asked for a pause.
        sent: { type: integer }
        failed: { type: integer }
        skipped: { type: integer }
        cancelled: { type: integer }

    Dashboard:
      type: object
      properties:
        scope: { type: string, enum: [mine, company] }
        day: { type: string, format: date, example: "2026-09-17" }
        timezone: { type: string, example: Asia/Tashkent }
        loads:
          type: object
          properties:
            today: { type: integer }
            month: { type: integer }
        posts:
          type: object
          properties:
            today: { $ref: "#/components/schemas/PostCounts" }
            month: { $ref: "#/components/schemas/PostCounts" }
            success_rate:
              type: number
              nullable: true
              description: Sent over sent plus failed today. Skips are the guard working, not failures.
              example: 0.95
            last_sent_at: { type: string, format: date-time, nullable: true }
        guard_today:
          type: object
          additionalProperties: { type: integer }
          description: Why posts were held back today, by reason.
          example: { cooldown: 4, duplicate: 1 }
        accounts:
          type: object
          properties:
            total: { type: integer }
            by_status:
              type: object
              additionalProperties: { type: integer }
              example: { active: 2, paused: 1 }
        groups:
          type: object
          properties:
            connected: { type: integer }
            postable:
              type: integer
              description: Active, with posting on and the account still allowed to write.
        ai:
          type: object
          properties:
            enabled: { type: boolean }
            requests_today: { type: integer }
            requests_month: { type: integer }
            cache_hits_month: { type: integer }
            cost_month_usd: { type: number, example: 1.25 }
            cost_month_micros: { type: integer, format: int64 }
        quota:
          type: array
          items: { $ref: "#/components/schemas/QuotaItem" }
        recent_problems:
          type: array
          maxItems: 5
          items:
            type: object
            properties:
              job_id: { type: string, format: uuid }
              group_id: { type: string, format: uuid }
              group_title: { type: string }
              status: { type: string, enum: [failed, skipped] }
              reason:
                type: string
                description: The guard's reason for a skip, or Telegram's error code for a failure.
              at: { type: string, format: date-time }

    TelegramLoginStep:
      type: object
      properties:
        account_id: { type: string, format: uuid }
        step:
          type: string
          enum: [code, password, connected]
          description: What the person has to do next.

    TelegramAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        mine:
          type: boolean
          description: Only the owner of an account can post with it or disconnect it.
        phone: { type: string, example: "+99890 *** ** 67" }
        label: { type: string }
        status:
          type: string
          enum: [connecting, active, paused, restricted, revoked, disabled]
          description: |
            paused is Telegram asking for a wait; restricted is Telegram limiting
            the account for sending too much, and nothing is sent until it is
            lifted; revoked means the session ended and the account has to be
            connected again.
        status_reason: { type: string, nullable: true }
        paused_until: { type: string, format: date-time, nullable: true }
        consent_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    TelegramDialog:
      type: object
      properties:
        peer_id: { type: string, example: "-1001234567890" }
        title: { type: string }
        username: { type: string, nullable: true }
        kind: { type: string, enum: [group, supergroup, channel] }
        member_count: { type: integer, nullable: true }
        slowmode_enabled: { type: boolean }
        can_send: { type: boolean }
        group_id:
          type: string
          format: uuid
          nullable: true
          description: Set when this group is already connected.

    GroupRoute:
      type: object
      description: One corridor. A country without a region means the whole country.
      properties:
        origin_country: { type: string, minLength: 2, maxLength: 2, nullable: true }
        origin_region_id: { type: string, format: uuid, nullable: true }
        destination_country: { type: string, minLength: 2, maxLength: 2, nullable: true }
        destination_region_id: { type: string, format: uuid, nullable: true }

    GroupRules:
      type: object
      properties:
        language: { type: string, enum: [uz, ru, en] }
        posting_enabled: { type: boolean }
        cargo_type_codes:
          type: array
          items: { type: string }
          description: Empty means the group takes any cargo.
        vehicle_types:
          type: array
          items: { $ref: "#/components/schemas/VehicleType" }
          description: Empty means the group takes any body.
        min_weight_kg: { type: integer, nullable: true }
        max_weight_kg: { type: integer, nullable: true }
        hourly_limit: { type: integer, minimum: 1, maximum: 10 }
        daily_limit:
          type: integer
          minimum: 1
          maximum: 20
          description: Capped at what the platform allows.
        cooldown_minutes:
          type: integer
          minimum: 0
          description: The group's own slow mode and the platform floor still apply if longer.
        quiet_from_hour: { type: integer, minimum: 0, maximum: 23, nullable: true }
        quiet_to_hour: { type: integer, minimum: 0, maximum: 23, nullable: true }
        notes: { type: string, maxLength: 500, nullable: true }
        routes:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/GroupRoute" }

    TelegramGroup:
      type: object
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        peer_id: { type: string }
        title: { type: string }
        username: { type: string, nullable: true }
        kind: { type: string }
        language: { type: string }
        member_count: { type: integer, nullable: true }
        slowmode_seconds: { type: integer }
        can_send: { type: boolean }
        posting_enabled: { type: boolean }
        active: { type: boolean }
        inactive_reason: { type: string, nullable: true }
        last_posted_at: { type: string, format: date-time, nullable: true }
        rules: { $ref: "#/components/schemas/GroupRules" }
        routes:
          type: array
          items: { $ref: "#/components/schemas/GroupRoute" }

    GroupDecision:
      type: object
      description: |
        One group and what the platform decided about it. Approved and held-back
        groups share a shape because the interface shows them together: the
        point of a preview is that a person sees the whole reasoning.
      properties:
        group_id: { type: string, format: uuid }
        title: { type: string }
        score:
          type: integer
          description: Why it ranked where it did, in points.
        reasons:
          type: array
          items: { type: string }
          description: What earned those points - route_region, vehicle_listed, posted_recently.
        reason:
          type: string
          description: Why it was held back - duplicate, cooldown, group_limit, account_limit, quiet_hours, group_unavailable.
        retry_after_seconds:
          type: integer
          description: Present when the answer is "not yet" rather than "no".

    PublishPreview:
      type: object
      properties:
        account_id: { type: string, format: uuid }
        candidates:
          type: integer
          description: How many groups matched before the guard ran.
        approved:
          type: array
          items: { $ref: "#/components/schemas/GroupDecision" }
        skipped:
          type: array
          items: { $ref: "#/components/schemas/GroupDecision" }
        message_preview:
          type: string
          description: Exactly what a group will receive.
        preview_token:
          type: string
          description: Ties a publish to the list that was reviewed. Single use, ten minutes.
        expires_at: { type: string, format: date-time }
        posts_left:
          type: integer
          nullable: true
          description: |
            Posts the plan still allows this month, or null when it sets no
            limit. Publishing more approved groups than this is refused.

    PublishResult:
      type: object
      properties:
        run_id: { type: string, format: uuid }
        load_ad_id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        queued: { type: integer }
        skipped: { type: integer }
        jobs:
          type: array
          items: { $ref: "#/components/schemas/PostingJob" }

    PostingJob:
      type: object
      description: One message on its way to one group.
      properties:
        id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        group_title: { type: string }
        status:
          type: string
          enum: [pending, processing, sent, failed, skipped, rate_limited, cancelled]
        skip_reason: { type: string }
        attempt: { type: integer }
        error_code:
          type: string
          description: The code Telegram returned when it refused, such as FLOOD_WAIT_X or CHAT_WRITE_FORBIDDEN.
        next_try_at: { type: string, format: date-time, nullable: true }
        sent_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    PlaceRef:
      type: object
      description: One end of a corridor - what was resolved, and the words the person wrote.
      properties:
        city_id: { type: string, format: uuid, nullable: true }
        region_id: { type: string, format: uuid, nullable: true }
        country: { type: string, minLength: 2, maxLength: 2, nullable: true, example: RU }
        text: { type: string, example: Москва }

    ParsedField:
      type: object
      description: |
        One value the parser resolved, with the words it was read from. The
        client renders this as a removable chip; removing it drops exactly the
        field it names.
      properties:
        value: { nullable: true }
        source:
          type: string
          enum: [rule, ai, user]
          description: Which rule or model produced the value.
        evidence:
          type: string
          description: The words in the advert this value was read from.
          example: 20 тонн

    ParsedAdvert:
      type: object
      properties:
        fields:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ParsedField" }
          description: |
            Keyed by field name - origin, destination, cargo_type, weight_kg,
            volume_m3, vehicle_type, loading_date, price, payment_terms,
            contact_phone. A field nobody resolved is present with a null value
            rather than absent.
        missing:
          type: array
          items: { type: string }
          description: What the advert still needs before it can be posted.
          example: [contact_phone]
        dropped:
          type: array
          items: { type: string }
          description: Words nothing understood, surfaced rather than swallowed.
        ai_used:
          type: boolean
          description: Whether a model contributed a field.
        ai_status:
          type: string
          enum: [off, not_needed, used, no_result, limited, unavailable]
          description: |
            How a model took part. off - none is configured; not_needed - the
            rules left nothing a model could find; used - it filled at least
            one field; no_result - it was asked and found nothing that checked
            out; limited - the plan's allowance or the day's budget is spent;
            unavailable - the provider failed. In every case the rules' reading
            is returned.
        draft:
          allOf:
            - $ref: "#/components/schemas/SaveLoadAd"
          description: The same content in the shape the create endpoint accepts.

    SaveLoadAd:
      type: object
      properties:
        raw_text: { type: string, maxLength: 4000 }
        origin_city_id: { type: string, format: uuid, nullable: true }
        origin_region_id: { type: string, format: uuid, nullable: true }
        origin_country: { type: string, minLength: 2, maxLength: 2, nullable: true }
        origin_text: { type: string, maxLength: 120 }
        destination_city_id: { type: string, format: uuid, nullable: true }
        destination_region_id: { type: string, format: uuid, nullable: true }
        destination_country: { type: string, minLength: 2, maxLength: 2, nullable: true }
        destination_text: { type: string, maxLength: 120 }
        cargo_type_id: { type: string, format: uuid, nullable: true }
        cargo_text: { type: string, maxLength: 120, nullable: true }
        weight_kg: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        volume_m3: { type: number, format: double, maximum: 200, nullable: true }
        vehicle_type: { $ref: "#/components/schemas/VehicleType" }
        loading_date: { type: string, format: date, nullable: true, example: "2026-09-16" }
        loading_date_text: { type: string, maxLength: 64, nullable: true, example: завтра }
        price_amount: { type: integer, format: int64, nullable: true, description: Minor units }
        price_currency: { type: string, minLength: 3, maxLength: 3, nullable: true, example: USD }
        price_negotiable: { type: boolean }
        payment_terms: { type: string, enum: [on_loading, on_delivery, prepayment, deferred], nullable: true }
        payment_method: { type: string, enum: [cash, transfer, card, escrow], nullable: true }
        contact_phone: { type: string, nullable: true, example: "+998901234567" }
        contact_name: { type: string, maxLength: 120, nullable: true }
        notes: { type: string, maxLength: 2000, nullable: true }

    LoadAd:
      allOf:
        - $ref: "#/components/schemas/SaveLoadAd"
        - type: object
          properties:
            id: { type: string, format: uuid }
            company_id: { type: string, format: uuid }
            status:
              type: string
              enum: [draft, ready, publishing, published, archived]
              description: |
                Derived from the content rather than set by the client: an
                advert carrying an origin, a destination and a phone number is
                ready, anything less is a draft.
            origin: { $ref: "#/components/schemas/PlaceRef" }
            destination: { $ref: "#/components/schemas/PlaceRef" }
            missing:
              type: array
              items: { type: string }
              description: Recomputed on read, never stored stale.
            fingerprint:
              type: string
              description: |
                Digest of what the advert means rather than how it was written,
                so the same offer retyped is recognised as a repeat by the
                duplicate check.
            published_at: { type: string, format: date-time, nullable: true }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    Envelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: {}
      required: [success]

    PaginatedEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            meta:
              type: object
              properties:
                page: { type: integer }
                per_page: { type: integer }
                total: { type: integer, format: int64 }
                total_pages: { type: integer }

    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code:
              type: string
              description: Stable machine code; branch on this, not the message.
              example: VALIDATION_ERROR
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
        trace_id:
          type: string
          description: Quote this when reporting a problem.

    User:
      type: object
      description: |
        The signed-in principal. `permissions` is the flattened effective set
        across every role — clients should gate UI on a permission, never on a
        role name, so that adding a role does not require a client release.
      properties:
        id: { type: string, format: uuid }
        phone: { type: string, example: "+998901234567" }
        email: { type: string, nullable: true }
        first_name: { type: string }
        last_name: { type: string }
        full_name: { type: string }
        avatar_url: { type: string, nullable: true }
        locale: { type: string, enum: [uz, ru, en] }
        status: { type: string, enum: [active, suspended, deleted] }
        phone_verified: { type: boolean }
        roles:
          type: array
          items:
            type: string
            enum: [driver, company_manager, dispatcher, admin, super_admin]
        permissions:
          type: array
          items: { type: string, example: bookings.create }
        driver_id: { type: string, format: uuid, nullable: true }
        company_id: { type: string, format: uuid, nullable: true }
        company_role: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }

    ParsedSearch:
      type: object
      properties:
        target:
          type: string
          enum: [loads, drivers]
        filters:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: |
            Ready to send verbatim to `/loads` or `/drivers`. Values are arrays
            because both endpoints read repeated keys as multi-value filters.
          example:
            pickup_region_id: ["765e9360-915e-4a65-b0bb-c8119ca6665b"]
            delivery_region_id: ["c5b8b32d-8304-472a-8e7c-6cb90f7c13dc"]
            vehicle_type: ["tent"]
            max_weight_kg: ["20000"]
        chips:
          type: array
          description: |
            One entry per understood filter, localised for the request's
            Accept-Language and ready to render as a removable chip. `field`
            names the query parameter, so removing a chip means dropping that
            key from `filters`.
          items:
            type: object
            properties:
              field: { type: string, example: pickup_region_id }
              label: { type: string, example: Qayerdan }
              value: { type: string }
        dropped:
          type: array
          items: { type: string }
          description: |
            Words that carried meaning but could not be resolved — an unknown
            region, a misspelling. Surfaced so the client can say the term was
            ignored, rather than letting a search quietly run without it.
          example: ["Qarshidan"]
        empty:
          type: boolean
          description: |
            Nothing was understood. The signal to leave the existing filters
            alone rather than replace them with nothing.

    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 900 }
        expires_at: { type: string, format: date-time }

    AuthResponse:
      type: object
      description: |
        What verify-otp, login and refresh all return. The tokens are nested
        under `tokens`, not spread at the top level — a client that reads
        `data.access_token` gets `undefined` and silently loses its session.

        `user` is included on refresh as well as login, because roles and
        permissions can change while a session is open; a client should adopt
        the returned principal rather than keeping the copy it got at sign-in.
      properties:
        user: { $ref: "#/components/schemas/User" }
        tokens: { $ref: "#/components/schemas/TokenPair" }

    Point:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, format: double, example: 41.2995 }
        lng: { type: number, format: double, example: 69.2401 }

    VehicleType:
      type: string
      enum:
        [tent, refrigerator, isothermal, flatbed, container, tanker,
         car_carrier, grain, dump, van, lowboy, other]

    LoadStatus:
      type: string
      enum:
        [draft, published, reserved, assigned, in_transit, delivered,
         completed, cancelled, expired]

    TripStatus:
      type: string
      enum:
        [created, en_route_to_pickup, at_pickup, loaded, in_transit,
         at_delivery, delivered, completed, cancelled, disputed]

    BookingStatus:
      type: string
      enum: [pending, offered, accepted, rejected, withdrawn, expired, cancelled]

    Address:
      type: object
      properties:
        id: { type: string, format: uuid }
        region_id: { type: string, format: uuid }
        region_name: { type: string }
        city_name: { type: string }
        line1: { type: string }
        formatted: { type: string }
        location: { $ref: "#/components/schemas/Point" }
        contact_name: { type: string, nullable: true }
        contact_phone: { type: string, nullable: true }

    SaveLoadRequest:
      type: object
      required: [title, weight_kg, pickup_address, delivery_address, pickup_from, price_amount]
      properties:
        title: { type: string, minLength: 3, maxLength: 255 }
        description: { type: string }
        cargo_type_id: { type: string, format: uuid }
        weight_kg: { type: integer, minimum: 1, maximum: 100000 }
        volume_m3: { type: number, format: double }
        pickup_address: { $ref: "#/components/schemas/AddressRequest" }
        delivery_address: { $ref: "#/components/schemas/AddressRequest" }
        pickup_from: { type: string, format: date-time }
        pickup_to: { type: string, format: date-time }
        delivery_from: { type: string, format: date-time }
        delivery_to: { type: string, format: date-time }
        required_vehicle_type: { $ref: "#/components/schemas/VehicleType" }
        requires_adr: { type: boolean }
        requires_refrigeration: { type: boolean }
        temp_min_c: { type: integer }
        temp_max_c: { type: integer }
        requires_tail_lift: { type: boolean }
        price_amount:
          type: integer
          description: Minor units (tiyin for UZS).
          example: 5000000
        price_currency: { type: string, example: UZS }
        price_type: { type: string, enum: [fixed, negotiable, per_km] }
        payment_terms:
          type: string
          enum: [on_loading, on_delivery, prepayment, deferred]
        photo_file_ids:
          type: array
          maxItems: 10
          items: { type: string, format: uuid }
        is_urgent: { type: boolean }
        publish:
          type: boolean
          description: Publish immediately instead of saving a draft.

    AddressRequest:
      type: object
      required: [line1, location]
      properties:
        region_id: { type: string, format: uuid }
        city_id: { type: string, format: uuid }
        line1: { type: string }
        formatted: { type: string }
        google_place_id: { type: string }
        location: { $ref: "#/components/schemas/Point" }
        contact_name: { type: string }
        contact_phone: { type: string }

    Load:
      type: object
      properties:
        id: { type: string, format: uuid }
        reference_no: { type: string, example: LD-2601-00042 }
        company_id: { type: string, format: uuid }
        title: { type: string }
        weight_kg: { type: integer }
        volume_m3: { type: number, format: double, nullable: true }
        pickup_address: { $ref: "#/components/schemas/Address" }
        delivery_address: { $ref: "#/components/schemas/Address" }
        pickup_from: { type: string, format: date-time }
        distance_km: { type: number, format: double, nullable: true }
        pickup_distance_km:
          type: number
          format: double
          nullable: true
          description: Distance from the searcher's point, when one was given.
        required_vehicle_type: { $ref: "#/components/schemas/VehicleType" }
        requires_adr: { type: boolean }
        requires_refrigeration: { type: boolean }
        price_amount: { type: integer, description: minor units }
        price_currency: { type: string }
        price_per_km: { type: number, format: double, nullable: true }
        payment_terms: { type: string }
        status: { $ref: "#/components/schemas/LoadStatus" }
        published_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        views_count: { type: integer }
        is_featured: { type: boolean }
        is_urgent: { type: boolean }
        is_saved: { type: boolean }
        company:
          type: object
          properties:
            id: { type: string, format: uuid }
            brand_name: { type: string }
            logo_url: { type: string, nullable: true }
            rating: { type: number, format: double }
            is_verified: { type: boolean }
            phone:
              type: string
              nullable: true
              description: >
                Present only for viewers with a live booking, company membership
                or an admin role.
        my_booking:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/BookingSummary" }]

    BookingSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/BookingStatus" }
        initiated_by: { type: string, enum: [driver, company] }
        price: { type: integer }
        currency: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }

    Booking:
      type: object
      properties:
        id: { type: string, format: uuid }
        load_id: { type: string, format: uuid }
        driver_id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid, nullable: true }
        initiated_by: { type: string, enum: [driver, company] }
        status: { $ref: "#/components/schemas/BookingStatus" }
        offered_price: { type: integer, nullable: true }
        agreed_price: { type: integer, nullable: true }
        currency: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
        trip_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }

    Wallet:
      type: object
      properties:
        id: { type: string, format: uuid }
        currency: { type: string }
        balance: { type: integer, description: minor units }
        held_balance: { type: integer, description: committed to an escrow }
        available: { type: integer, description: balance minus held_balance }
        status: { type: string, enum: [active, frozen, closed] }
