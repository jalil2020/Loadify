        d="M45.5 18h27a3.5 3.5 0 0 1 3.5 3.5v23a3.5 3.5 0 0 1-3.5 3.5h-27a3.5 3.5 0 0 1-3.5-3.5v-23a3.5 3.5 0 0 1 3.5-3.5z"/>
  <path stroke="#FFF" stroke-width="3.2" fill="none" d="M42 27h34M59 18v9"/>
</svg>
