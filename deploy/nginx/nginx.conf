user  nginx;
# One worker per core; auto reads the cgroup limit inside a container.
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    # Accept as many connections as are ready per wakeup rather than one.
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $request_id ties an access-log line to the API's own structured log, which
    # is the difference between "a 500 happened" and "this request failed here".
    log_format json escape=json '{'
        '"ts":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"referer":"$http_referer",'
        '"agent":"$http_user_agent",'
        '"request_id":"$request_id"'
    '}';

    access_log  /var/log/nginx/access.log json;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    # Mobile clients on 3G go quiet for long stretches; a short keepalive would
    # churn connections for nothing.
    keepalive_timeout   75s;
    client_max_body_size 20m;
    client_body_timeout  30s;
    client_header_timeout 15s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/plain
        text/javascript
        image/svg+xml;

    # A second line of defence behind the API's own limiter: this one stops the
    # traffic before it costs a goroutine.
    limit_req_zone  $binary_remote_addr zone=api:16m   rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=auth:8m   rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=conn:16m;

    # Trust the real client address from the load balancer, not the hop.
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/conf.d/*.conf;
}
