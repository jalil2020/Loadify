name: Mobile CI

on:
  push:
    branches: [main, develop]
    paths: ["android/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/mobile.yml"]

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.35.5"

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install
        run: flutter pub get

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .

      # Strict analysis: the project turns on strict-casts and strict-inference,
      # which is what keeps a loosely-typed JSON response from silently becoming
      # a runtime failure in a driver's hand.
      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [verify]
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Debug, not release: signing keys are not in CI. This proves the Android
      # toolchain and the Dart code compile together, which is the part that
      # analysis alone cannot tell you.
      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: loadify-debug-apk
          path: android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
