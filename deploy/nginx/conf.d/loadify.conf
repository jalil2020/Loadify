upstream loadify_api {
    # Add more `server` lines to scale out; NGINX will round-robin them.
    server api:8080 max_fails=3 fail_timeout=15s;
    # Reuse upstream connections: at our request rate the TCP handshake is a
    # measurable share of the latency budget.
    keepalive 64;
}

# Plain HTTP exists only to answer ACME challenges and redirect.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.loadify.uz;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # The API serves JSON only, so nothing it returns should ever be executable
    # or embeddable.
    add_header Content-Security-Policy   "default-src 'none'; frame-ancestors 'none'" always;

    limit_conn conn 100;

    # Health checks must not be rate limited or logged: the noise buries real
    # traffic and a throttled probe reads as an outage.
    location = /health {
        access_log off;
        proxy_pass http://loadify_api;
    }

    location = /health/ready {
        access_log off;
        proxy_pass http://loadify_api;
    }

    # Credential endpoints get the tight limiter.
    location ~ ^/api/v1/auth/(login|register|refresh|verify-otp|resend-otp|forgot-password|reset-password)$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://loadify_api;
        include /etc/nginx/conf.d/proxy-params.inc;
    }

    # WebSocket: the upgrade needs its own block, and the read timeout must
    # outlast the 25s application ping or NGINX would cut every idle socket.
    location /api/v1/ws {
        proxy_pass http://loadify_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        # Buffering a stream defeats the point of having one.
        proxy_buffering off;
    }

    # Payment callbacks: providers retry hard, so they get room, and the raw
    # body must reach the API unmodified for the signature to verify.
    location /api/v1/payments/webhooks/ {
        proxy_pass http://loadify_api;
        proxy_request_buffering off;
        include /etc/nginx/conf.d/proxy-params.inc;
    }

    location /api/v1/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://loadify_api;
        include /etc/nginx/conf.d/proxy-params.inc;
    }

    location / {
        return 404 '{"success":false,"error":{"code":"NOT_FOUND","message":"Not found"}}';
        add_header Content-Type application/json always;
    }
}
