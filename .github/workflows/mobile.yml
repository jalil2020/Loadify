name: Mobile CI

on:
  push:
    branches: [main, develop]
    paths: ["android/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/mobile.yml"]

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Kotlin is compiled with allWarningsAsErrors, so a deprecation is a
      # build failure here rather than a slow accumulation nobody reads. That
      # is what caught the non-mirrored arrow icons that would have pointed the
      # wrong way in an RTL layout.
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      # The release build is the one that runs R8. Shipping without proving it
      # here means finding out that minification stripped the serializers only
      # after the store rollout.
      - name: Assemble release
        run: ./gradlew :app:assembleRelease

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: loadify-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
