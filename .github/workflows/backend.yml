name: Backend CI

on:
  push:
    branches: [main, develop]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

# A new push supersedes an in-flight run for the same ref; there is no value in
# finishing CI for a commit nobody will merge.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: gofmt
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: staticcheck
        working-directory: backend
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      # The real thing, not a stub: the schema depends on PostGIS, so a test
      # against plain Postgres would prove nothing about the queries.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: loadify
          POSTGRES_PASSWORD: loadify_test
          POSTGRES_DB: loadify_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loadify"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Apply migrations
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: loadify
          DB_PASSWORD: loadify_test
          DB_NAME: loadify_test
          DB_SSLMODE: disable
        run: go run ./cmd/migrate up

      # Migrations must be reversible, or a bad release cannot be rolled back.
      # Running down-then-up proves it before anyone needs it at 3am.
      - name: Verify migrations roll back
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: loadify
          DB_PASSWORD: loadify_test
          DB_NAME: loadify_test
          DB_SSLMODE: disable
        run: |
          go run ./cmd/migrate down
          go run ./cmd/migrate up

      - name: Test with race detector
        working-directory: backend
        env:
          APP_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: loadify
          DB_PASSWORD: loadify_test
          DB_NAME: loadify_test
          DB_SSLMODE: disable
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: test_access_secret_at_least_32_characters
          JWT_REFRESH_SECRET: test_refresh_secret_at_least_32_characters
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        working-directory: backend
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.out

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      # Known vulnerabilities in dependencies, filtered to the ones actually
      # reachable from our code.
      - name: govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    # Only publish from the default branch; a PR build proves the Dockerfile
    # works without pushing anything.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:latest
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
