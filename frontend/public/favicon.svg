<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Loadify">
  <!--
    The mark: an L carrying a package, opening into a forward arrow. Same
    geometry as the Android launcher icon, so a driver moving between phone and
    desktop sees one product.

    The motion lines and the wordmark from the full logo are omitted — at 16px
    they are mud, and the silhouette is what identifies the tab.
  -->
